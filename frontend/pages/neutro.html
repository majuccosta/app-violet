<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Lista de compras</title>
  <link rel="icon" href="data:,">
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f6f6; color: #222; }
    main { max-width: 420px; margin: 0 auto; min-height: 100dvh; background: #fff; padding: 24px 20px; }
    h1 { font-size: 1.5rem; margin: 0 0 4px; user-select: none; -webkit-user-select: none; }
    small { color: #777; }
    ul { list-style: none; padding: 0; margin: 20px 0 0; }
    li { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid #eee; font-size: 1rem; }
    input { width: 20px; height: 20px; }
    li.feito span { text-decoration: line-through; color: #999; }
  </style>
</head>
<body>
  <main>
    <h1 id="titulo">Lista de compras</h1>
    <small>Atualizada hoje</small>
    <ul>
      <li><input type="checkbox" id="i1"><label for="i1"><span>Arroz e feijão</span></label></li>
      <li><input type="checkbox" id="i2" checked><label for="i2"><span>Leite</span></label></li>
      <li><input type="checkbox" id="i3"><label for="i3"><span>Frutas</span></label></li>
      <li><input type="checkbox" id="i4"><label for="i4"><span>Pão integral</span></label></li>
      <li><input type="checkbox" id="i5" checked><label for="i5"><span>Café</span></label></li>
      <li><input type="checkbox" id="i6"><label for="i6"><span>Detergente</span></label></li>
    </ul>
  </main>
  <script>
    // Tela neutra da "saída rápida". Para voltar ao Violet, segure o título por 2 segundos.
    document.querySelectorAll("input").forEach((c) => c.addEventListener("change", () => c.closest("li").classList.toggle("feito", c.checked)));
    document.querySelectorAll("input:checked").forEach((c) => c.closest("li").classList.add("feito"));
    // O botão "voltar" do navegador não leva de volta ao app
    history.pushState(null, "", location.href);
    addEventListener("popstate", () => history.pushState(null, "", location.href));
    let t;
    const titulo = document.getElementById("titulo");
    const iniciar = () => { t = setTimeout(() => location.replace("home.html"), 2000); };
    const parar = () => clearTimeout(t);
    ["pointerdown"].forEach((e) => titulo.addEventListener(e, iniciar));
    ["pointerup", "pointerleave", "pointercancel"].forEach((e) => titulo.addEventListener(e, parar));
  </script>
</body>
</html>
