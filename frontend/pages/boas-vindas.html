<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7d6f7">
  <title>Boas-vindas · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
  <style>
    .tour { position: relative; min-height: 100dvh; display: flex; flex-direction: column; padding: var(--sp-5); gap: var(--sp-4); overflow: hidden; background: var(--grad-hero); }
    .tour::before, .tour::after { content: ""; position: absolute; border-radius: 50%; filter: blur(60px); opacity: .55; pointer-events: none; }
    .tour::before { width: 260px; height: 260px; top: -80px; right: -90px; background: var(--violet-300); }
    .tour::after { width: 240px; height: 240px; bottom: -90px; left: -90px; background: #f0a3cf; opacity: .35; }
    .tour > * { position: relative; z-index: 1; }
    .tour__top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-3); }
    .tour__count { font-size: var(--fs-sm); color: var(--ink-500); font-weight: 600; }
    .tour__body { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: var(--sp-5); animation: tourIn .45s ease both; }
    .tour__body h1 { font-size: var(--fs-2xl, 1.75rem); line-height: 1.15; background: var(--grad-primary); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .tour__body p { max-width: 32ch; line-height: 1.6; color: var(--ink-500); }
    .tour__chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .tour__chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--surface); color: var(--violet-600); font-size: var(--fs-sm); font-weight: 600; box-shadow: 0 2px 10px rgba(100,36,140,.12); }
    .tour__chip svg { width: 16px; height: 16px; }
    .tour__dots { display: flex; justify-content: center; gap: 8px; }
    .tour__dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-300); transition: all .3s; }
    .tour__dots i.is-on { width: 26px; border-radius: 8px; background: var(--grad-primary); }
    .tour__perms { width: 100%; text-align: left; }

    /* ---- Ilustrações ---- */
    .art { position: relative; width: 220px; height: 220px; display: grid; place-items: center; }
    .art__glow { position: absolute; inset: 12px; border-radius: 50%; background: var(--grad-primary); opacity: .12; filter: blur(14px); animation: pulse 3.2s ease-in-out infinite; }
    .art__logo { position: relative; width: 108px; height: 108px; filter: drop-shadow(0 10px 22px rgba(100,36,140,.35)); animation: float 4s ease-in-out infinite; }
    .art__orbit { position: absolute; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); color: var(--violet-600); box-shadow: 0 6px 18px rgba(100,36,140,.22); }
    .art__orbit svg { width: 22px; height: 22px; }
    .art__orbit--a { top: 8px; left: 18px; animation: float 3.6s ease-in-out infinite; }
    .art__orbit--b { top: 40px; right: 0; animation: float 4.4s ease-in-out .6s infinite; }
    .art__orbit--c { bottom: 10px; left: 38px; animation: float 3.9s ease-in-out 1.1s infinite; }

    .sos { position: relative; width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--grad-danger); box-shadow: 0 14px 34px rgba(239,51,85,.45); }
    .sos svg { width: 52px; height: 52px; }
    .sos::before, .sos::after { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(239,51,85,.55); animation: ring 2.4s ease-out infinite; }
    .sos::after { animation-delay: 1.2s; }
    .sos__tag { position: absolute; bottom: -16px; padding: 6px 14px; border-radius: 999px; background: var(--surface); color: var(--ink-900); font-weight: 700; font-size: var(--fs-sm); box-shadow: 0 6px 16px rgba(0,0,0,.15); }

    .rede { display: flex; flex-direction: column; align-items: center; gap: 14px; }
    .rede__row { display: flex; }
    .rede__av { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: #fff; border: 3px solid var(--bg); margin-left: -12px; box-shadow: 0 6px 14px rgba(100,36,140,.25); animation: pop .5s ease both; }
    .rede__av:first-child { margin-left: 0; }
    .rede__av--vazio { background: var(--surface); color: var(--violet-500); border: 2px dashed var(--violet-300); box-shadow: none; }
    .rede__av svg { width: 22px; height: 22px; }
    .rede__me { display: grid; place-items: center; width: 84px; height: 84px; border-radius: 50%; background: var(--grad-primary); color: #fff; box-shadow: 0 12px 28px rgba(100,36,140,.35); }
    .rede__me svg { width: 38px; height: 38px; }
    .rede__link { width: 2px; height: 18px; background: linear-gradient(var(--violet-400), transparent); }

    .fone { position: relative; width: 150px; height: 210px; border-radius: 26px; background: var(--surface); border: 3px solid var(--violet-300); box-shadow: 0 14px 34px rgba(100,36,140,.25); overflow: hidden; }
    .fone__barra { display: flex; justify-content: flex-end; padding: 10px; }
    .fone__olho { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--grad-primary); animation: pulse 2s ease-in-out infinite; }
    .fone__olho svg { width: 18px; height: 18px; }
    .fone__linha { height: 10px; margin: 8px 14px; border-radius: 6px; background: var(--violet-100); }
    .fone__linha--curta { width: 55%; }
    .fone__seta { position: absolute; top: 46px; right: 18px; color: var(--violet-500); font-size: 22px; animation: float 1.6s ease-in-out infinite; }
    .fone__neutro { position: absolute; inset: 0; background: #f2f2f2; opacity: 0; animation: trocar 5s ease-in-out infinite; display: grid; place-items: center; color: #888; font-size: 12px; font-weight: 600; }

    @keyframes tourIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    @keyframes ring { from { transform: scale(1); opacity: .9; } to { transform: scale(1.7); opacity: 0; } }
    @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    @keyframes trocar { 0%, 55% { opacity: 0; } 65%, 90% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .tour__body, .art *, .sos::before, .sos::after, .rede__av, .fone__olho, .fone__seta, .fone__neutro { animation: none !important; } }
  </style>
</head>
<body>
  <div class="app">
    <main class="tour" id="tour">
      <div class="tour__top">
        <span class="tour__count" id="contagem"></span>
        <button class="btn btn--ghost btn--sm" id="pular">Pular</button>
      </div>
      <section class="tour__body" id="corpo" aria-live="polite"></section>
      <div class="tour__dots" id="pontos" aria-hidden="true"></div>
      <div class="stack-sm">
        <button class="btn btn--primary" id="proximo">Próximo</button>
        <button class="btn btn--soft" id="voltar" hidden>Voltar</button>
      </div>
    </main>
  </div>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const { icon, esc, disp } = Violet;
      const corpo = document.getElementById("corpo"), pontos = document.getElementById("pontos"), contagem = document.getElementById("contagem");
      const chip = (ic, txt) => `<span class="tour__chip">${icon(ic)}${esc(txt)}</span>`;

      /* Ilustração de cada passo */
      const ARTES = {
        boasvindas: () => `<div class="art"><span class="art__glow"></span>
          <img class="art__logo" src="../assets/img/logo.svg" alt="">
          <span class="art__orbit art__orbit--a">${icon("heart")}</span>
          <span class="art__orbit art__orbit--b">${icon("shield-check")}</span>
          <span class="art__orbit art__orbit--c">${icon("sparkles")}</span></div>`,
        emergencia: () => `<div class="art"><span class="sos">${icon("siren")}<span class="sos__tag">Segure 3 s</span></span></div>`,
        rede: () => {
          const cores = ["#7a2fb0", "#a23fa8", "#c75a9e"];
          const av = ["A", "M", "L"].map((l, k) => `<span class="rede__av" style="background:${cores[k]};animation-delay:${k * 0.12}s">${l}</span>`).join("");
          return `<div class="rede"><span class="rede__me">${icon("user")}</span><span class="rede__link"></span>
            <div class="rede__row">${av}<span class="rede__av rede__av--vazio" style="animation-delay:.36s">${icon("plus")}</span><span class="rede__av rede__av--vazio" style="animation-delay:.48s">${icon("plus")}</span></div></div>`;
        },
        discricao: () => `<div class="fone"><div class="fone__barra"><span class="fone__olho">${icon("eye-off")}</span></div>
          <div class="fone__linha"></div><div class="fone__linha fone__linha--curta"></div><div class="fone__linha"></div><div class="fone__linha fone__linha--curta"></div>
          <span class="fone__seta">↑</span><div class="fone__neutro">Calculadora</div></div>`,
        permissoes: () => `<div class="art" style="width:120px;height:120px"><span class="art__glow"></span><span class="art__orbit" style="position:relative;width:96px;height:96px;background:var(--grad-primary);color:#fff">${icon("shield-check")}</span></div>`
      };

      const SLIDES = [
        { arte: "boasvindas", t: "Bem-vinda ao Violet", d: "Um espaço seguro, só para mulheres do campus. Em menos de um minuto você conhece o essencial.", chips: [["lock", "Só mulheres"], ["shield-check", "Verificada"], ["heart", "Apoio"]] },
        { arte: "emergencia", t: "Botão de emergência", d: "Segure o botão por 3 segundos para avisar seus contatos de confiança e a central de apoio. Em Configurações, ligue o alerta silencioso." },
        { arte: "rede", t: "Sua rede de apoio", d: "Cadastre até 5 contatos de confiança. Eles podem ser avisados em emergências e acompanhar seus trajetos.", extra: `<a class="btn btn--soft" href="contato-adicionar.html" target="_blank" rel="noopener">Adicionar contato agora</a>` },
        { arte: "discricao", t: "Discrição", d: "O botão de saída rápida (o olho riscado) fecha o app e abre uma tela neutra. Você também pode criar um PIN e esconder as notificações." },
        { arte: "permissoes", t: "Permissões, uma de cada vez", d: "Pedimos só o necessário e explicamos para quê. Você pode mudar depois nas configurações do navegador.", perms: true }
      ];
      let i = 0;
      const estado = {};
      const PERMS = [
        { id: "loc", ic: "map-pin", nome: "Localização", porque: "Para enviar onde você está quando acionar a emergência ou compartilhar um trajeto." },
        { id: "not", ic: "bell", nome: "Notificações", porque: "Para avisar de mensagens e de pedidos da sua rede, mesmo com o app fechado." }
      ];
      const rotulo = (id) => estado[id] === "ok" ? "Permitido ✓" : estado[id] === "nao" ? "Não permitido" : "Permitir";
      function perms() {
        return `<div class="stack-sm tour__perms">${PERMS.map((p) => `
          <div class="card stack-sm"><div class="row-between"><span style="display:flex;align-items:center;gap:8px;color:var(--violet-600)">${icon(p.ic)}<b style="color:var(--ink-900)">${p.nome}</b></span>
            <button class="btn btn--soft btn--sm" data-perm="${p.id}" ${estado[p.id] === "ok" ? "disabled" : ""}>${rotulo(p.id)}</button></div>
            <p class="text-sm text-muted" style="max-width:none">${p.porque}</p></div>`).join("")}
          <p class="text-xs text-muted" style="max-width:none">Câmera e microfone só são pedidos se você escolher enviar foto, vídeo ou áudio durante uma emergência.</p></div>`;
      }
      function desenhar() {
        const s = SLIDES[i];
        const chips = s.chips ? `<div class="tour__chips">${s.chips.map(([ic, t]) => chip(ic, t)).join("")}</div>` : "";
        corpo.innerHTML = `${ARTES[s.arte]()}<div class="stack-sm" style="align-items:center"><h1>${esc(s.t)}</h1><p>${esc(s.d)}</p></div>${chips}${s.extra || ""}${s.perms ? perms() : ""}`;
        pontos.innerHTML = SLIDES.map((_, k) => `<i class="${k === i ? "is-on" : ""}"></i>`).join("");
        contagem.textContent = `${i + 1} de ${SLIDES.length}`;
        document.getElementById("proximo").textContent = i === SLIDES.length - 1 ? "Começar" : "Próximo";
        document.getElementById("voltar").hidden = i === 0;
        corpo.style.animation = "none"; void corpo.offsetWidth; corpo.style.animation = "";
      }
      const terminar = () => { disp.set("tutorial_visto", true); disp.set("tutorial_pendente", false); Violet.irPara("home.html"); };
      const proximo = () => (i < SLIDES.length - 1 ? (i++, desenhar()) : terminar());
      const voltar = () => { if (i > 0) { i--; desenhar(); } };
      document.getElementById("proximo").addEventListener("click", proximo);
      document.getElementById("voltar").addEventListener("click", voltar);
      document.getElementById("pular").addEventListener("click", terminar);
      document.addEventListener("keydown", (e) => { if (e.key === "ArrowRight") proximo(); else if (e.key === "ArrowLeft") voltar(); });
      // Arrastar para o lado troca de passo (celular)
      let x0 = null;
      const tour = document.getElementById("tour");
      tour.addEventListener("touchstart", (e) => { x0 = e.touches[0].clientX; }, { passive: true });
      tour.addEventListener("touchend", (e) => {
        if (x0 === null) return;
        const dx = e.changedTouches[0].clientX - x0; x0 = null;
        if (Math.abs(dx) > 60) (dx < 0 ? proximo() : voltar());
      }, { passive: true });
      corpo.addEventListener("click", (e) => {
        const b = e.target.closest("[data-perm]"); if (!b) return;
        const id = b.dataset.perm;
        const feito = (ok) => { estado[id] = ok ? "ok" : "nao"; desenhar(); };
        if (id === "loc") {
          if (!navigator.geolocation) return feito(false);
          navigator.geolocation.getCurrentPosition(() => feito(true), () => feito(false), { timeout: 10000 });
        } else {
          if (!("Notification" in window)) return feito(false);
          Notification.requestPermission().then((r) => feito(r === "granted")).catch(() => feito(false));
        }
      });
      desenhar();
    });
  </script>
</body>
</html>
