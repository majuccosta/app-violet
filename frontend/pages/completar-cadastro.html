<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#64248c">
  <title>Complete seu cadastro · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app">
    <header class="auth-head">
      <img src="../assets/img/logo.svg" alt="Violet">
      <h1>Complete seu cadastro</h1>
      <p>Falta só uma informação para continuar. Ela é usada para confirmar a idade mínima de uso do Violet.</p>
    </header>

    <main class="screen" style="padding-top:0">
      <form id="form-completar" class="stack" novalidate>
        <div class="field">
          <label class="field__label" for="nascimento">Data de nascimento</label>
          <div class="input-wrap">
            <i data-icon="calendar"></i>
            <input id="nascimento" name="nascimento" type="date" autocomplete="bday" required>
          </div>
          <span class="field__error">Informe sua data de nascimento.</span>
          <p class="field__hint">Depois de salva, a data não pode ser alterada. Confira antes de continuar.</p>
        </div>

        <div class="field">
          <label class="check">
            <input type="checkbox" name="termos" required>
            <span>Eu aceito os <a href="termos.html?de=cadastro" class="link" target="_blank" rel="noopener">Termos de Uso</a> e a <a href="politica.html?de=cadastro" class="link" target="_blank" rel="noopener">Política de Privacidade</a> do Violet, em conformidade com a LGPD.</span>
          </label>
          <span class="field__error">Você precisa aceitar os termos para continuar.</span>
        </div>

        <button type="submit" class="btn btn--primary">Continuar <i data-icon="arrow-right" data-size="sm"></i></button>
      </form>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/datas.js"></script>
  <script src="../assets/js/pages/completar-cadastro.js"></script>
</body>
</html>
