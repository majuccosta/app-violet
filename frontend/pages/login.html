<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#64248c">
  <title>Entrar · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app">
    <header class="auth-head">
      <img src="../assets/img/logo.svg" alt="Violet">
      <h1>Bem-vinda de volta</h1>
      <p>Entre na sua conta para continuar.</p>
    </header>

    <main class="screen" style="padding-top:0">
      <form id="form-login" class="stack" novalidate>
        <div class="field">
          <label class="field__label" for="email">E-mail ou telefone</label>
          <div class="input-wrap">
            <i data-icon="mail"></i>
            <input id="email" name="email" type="text" autocomplete="username" placeholder="seuemail@instituicao.edu.br" required>
          </div>
          <span class="field__error">Informe seu e-mail ou telefone.</span>
        </div>

        <div class="field">
          <label class="field__label" for="senha">Senha</label>
          <div class="input-wrap">
            <i data-icon="lock"></i>
            <input id="senha" name="senha" type="password" autocomplete="current-password" placeholder="Sua senha" required data-min="6">
            <button type="button" class="icon-btn" data-toggle-password aria-label="Mostrar senha" style="width:32px;height:32px"><i data-icon="eye" data-size="sm"></i></button>
          </div>
          <span class="field__error">A senha precisa ter pelo menos 6 caracteres.</span>
        </div>

        <a href="recuperar-senha.html" class="link text-sm" style="align-self:flex-end">Esqueceu sua senha?</a>

        <button type="submit" class="btn btn--primary">Entrar</button>
      </form>

      <div class="divider-text">ou entre com</div>
      <div class="social">
        <button type="button" aria-label="Entrar com Google" data-social="Google"><i data-icon="google"></i></button>
        <button type="button" aria-label="Entrar com Apple" data-social="Apple"><i data-icon="apple"></i></button>
        <button type="button" aria-label="Entrar com Facebook" data-social="Facebook"><i data-icon="facebook"></i></button>
      </div>

      <p class="text-center text-sm text-muted push-bottom">Ainda não tem conta? <a href="cadastro.html" class="link">Cadastre-se</a></p>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/auth.js"></script>
</body>
</html>
