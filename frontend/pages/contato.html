<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7fc">
  <title>Contato · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app has-nav" data-nav="rede">
    <header class="topbar" style="grid-template-columns:44px 1fr 44px">
      <button class="icon-btn" type="button" data-back="rede.html" aria-label="Voltar"><i data-icon="arrow-left"></i></button>
      <span class="topbar__title">Contato</span>
      <span></span>
    </header>

    <main class="screen">
      <section class="profile-card">
        <span class="avatar avatar--lg" id="c-avatar">—</span>
        <h2 id="c-nome">Carregando…</h2>
        <span class="badge" id="c-tipo"></span>
      </section>

      <dl class="summary">
        <div class="summary__row"><dt>Telefone</dt><dd id="c-telefone">—</dd></div>
        <div class="summary__row" id="row-relacao"><dt>Relação</dt><dd id="c-relacao">—</dd></div>
        <div class="summary__row" id="row-alertas"><dt>Recebe alertas</dt><dd id="c-alertas">—</dd></div>
        <div class="summary__row" id="row-local"><dt>Vê localização</dt><dd id="c-local">—</dd></div>
      </dl>

      <div class="stack-sm push-bottom">
        <a class="btn btn--primary" id="c-mensagem" href="conversas.html"><i data-icon="message" data-size="sm"></i> Enviar mensagem</a>
        <a class="btn btn--soft" id="c-promover" href="#" hidden><i data-icon="heart" data-size="sm"></i> Tornar contato de confiança</a>
        <a class="btn btn--soft" id="c-ligar" href="#"><i data-icon="phone" data-size="sm"></i> Ligar</a>
        <button class="btn btn--ghost" id="c-rebaixar" type="button" hidden>Remover dos contatos de confiança</button>
        <button class="btn btn--ghost" id="c-remover" type="button" style="color:var(--danger-600)"><i data-icon="trash" data-size="sm"></i> Excluir contato</button>
      </div>
    </main>
  </div>
  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/rede.js"></script>
</body>
</html>
