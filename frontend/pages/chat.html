<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#64248c">
  <title>Conversa · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar topbar--chat" style="grid-template-columns:44px 1fr 44px 44px">
      <button class="icon-btn" data-back="conversas.html" aria-label="Voltar"><i data-icon="arrow-left"></i></button>
      <div class="row" style="gap:var(--sp-2)">
        <span class="avatar avatar--sm" id="chat-avatar">—</span>
        <div>
          <div class="chat-head__nome" id="chat-nome">…</div>
          <span class="convo-tag convo-tag--circulo" id="chat-tag" hidden>Contato de confiança</span>
          <div class="chat-head__status" id="chat-status"></div>
        </div>
      </div>
      <button class="icon-btn" id="btn-silenciar" aria-label="Silenciar conversa"><i data-icon="bell"></i></button>
      <button class="icon-btn" aria-label="Mais opções" onclick="Violet.openSheet('sheet-opcoes')"><i data-icon="more-v"></i></button>
    </header>

    <div class="chat" id="chat" aria-live="polite">
      <span class="chat__day">Hoje</span>
    </div>

    <form class="composer" id="composer">
      <button type="button" class="icon-btn composer__clip" aria-label="Anexar"><i data-icon="paperclip"></i></button>
      <input id="msg" autocomplete="off" placeholder="Escreva uma mensagem…" aria-label="Mensagem">
      <button class="send" type="submit" aria-label="Enviar"><i data-icon="send" data-size="sm"></i></button>
    </form>

    <div class="sheet-backdrop" id="sheet-opcoes" role="dialog" aria-modal="true" aria-label="Opções da conversa">
      <div class="sheet stack-sm">
        <div class="sheet__handle"></div>
        <button class="list-item" style="border:0" id="editar-grupo" hidden><i data-icon="edit"></i><span class="grow">Editar grupo</span></button>
        <button class="list-item" style="border:0;color:var(--danger)" id="excluir-grupo" hidden><i data-icon="trash-2"></i><span class="grow">Excluir grupo</span></button>
        <button class="list-item" style="border:0;color:var(--danger)" id="sair-grupo" hidden><i data-icon="log-out"></i><span class="grow">Sair do grupo</span></button>
        <button class="list-item" style="border:0" id="btn-membros" hidden><i data-icon="users"></i><span class="grow">Participantes</span></button>
        <button class="list-item" style="border:0" id="btn-denunciar"><i data-icon="flag"></i><span class="grow" id="txt-denunciar">Denunciar usuária</span></button>
        <button class="list-item" style="border:0;color:var(--danger)" id="btn-bloquear"><i data-icon="x"></i><span class="grow">Bloquear usuária</span></button>
        <button class="btn btn--soft" onclick="Violet.closeSheet('sheet-opcoes')">Fechar</button>
      </div>
    </div>
    <!-- Participantes do grupo: denunciar, bloquear e (para a criadora) remover -->
    <div class="sheet-backdrop" id="sheet-membros" role="dialog" aria-modal="true" aria-labelledby="membros-titulo">
      <div class="sheet stack-sm">
        <div class="sheet__handle"></div>
        <h3 id="membros-titulo">Participantes</h3>
        <p class="text-sm text-muted" id="membros-dica"></p>
        <div class="list" id="lista-membros"></div>
        <button class="btn btn--soft" onclick="Violet.closeSheet('sheet-membros')">Fechar</button>
      </div>
    </div>

    <!-- Confirmar bloqueio -->
    <div class="sheet-backdrop" id="sheet-bloquear" role="dialog" aria-modal="true" aria-labelledby="bloq-titulo">
      <div class="sheet stack">
        <div class="sheet__handle"></div>
        <h3 id="bloq-titulo">Bloquear usuária?</h3>
        <p class="text-sm text-muted" id="bloq-desc">Ela não conseguirá falar com você e a conversa some da sua lista. Você pode desbloquear em Configurações, em Privacidade.</p>
        <button class="btn btn--primary" id="bloq-confirmar" style="background:var(--danger-600)">Bloquear</button>
        <button class="btn btn--soft" onclick="Violet.closeSheet('sheet-bloquear')">Cancelar</button>
      </div>
    </div>

    <!-- Denunciar usuária ou grupo -->
    <div class="sheet-backdrop" id="sheet-denunciar" role="dialog" aria-modal="true" aria-labelledby="den-titulo">
      <div class="sheet stack about-sheet" style="max-height:88dvh;overflow-y:auto">
        <div class="sheet__handle"></div>
        <div class="stack-sm">
          <h3 id="den-titulo">Denunciar</h3>
          <p class="text-sm text-muted">Nossa equipe analisa cada denúncia. A outra pessoa não é avisada.</p>
        </div>
        <div class="list" id="den-motivos" role="radiogroup" aria-label="Motivo da denúncia"></div>
        <div class="field">
          <label class="field__label" for="den-detalhe">Quer contar mais? (opcional)</label>
          <div class="input-wrap input-wrap--textarea"><textarea id="den-detalhe" maxlength="500" placeholder="O que aconteceu?"></textarea></div>
        </div>
        <label class="check" id="den-bloquear-wrap"><input type="checkbox" id="den-bloquear"><span>Bloquear também</span></label>
        <button class="btn btn--primary" id="den-enviar">Enviar denúncia</button>
        <button class="btn btn--soft" onclick="Violet.closeSheet('sheet-denunciar')">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/conversas.js"></script>
</body>
</html>
