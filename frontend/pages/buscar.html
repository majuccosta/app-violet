<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#64248c">
  <title>Encontrar usuárias · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <link rel="stylesheet" href="../assets/css/conexoes.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app has-nav" data-nav="conversas">
    <header class="topbar">
      <a class="icon-btn" href="conversas.html" aria-label="Voltar"><i data-icon="arrow-left"></i></a>
      <span class="topbar__title">Encontrar usuárias</span>
      <span></span>
    </header>

    <main class="screen achar">
      <div class="achar__aviso" id="aviso-privacidade" hidden></div>

      <section class="achar__bloco" id="pedidos" hidden aria-label="Pedidos recebidos">
        <h2 class="achar__titulo">Pedidos de conexão</h2>
        <div id="pedidos-lista" class="achar__bloco"></div>
      </section>

      <label class="input-wrap achar__busca">
        <i data-icon="search"></i>
        <input type="search" id="q" placeholder="Buscar por nome ou apelido…" autocomplete="off" aria-label="Buscar usuárias">
      </label>

      <section class="achar__bloco" id="resultados" aria-live="polite"></section>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/pages/buscar.js"></script>

</html>
