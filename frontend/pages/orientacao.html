<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7fc">
  <title>Orientações · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app has-nav" data-nav="inicio">
    <header class="topbar">
      <a class="icon-btn" href="orientacoes.html" aria-label="Voltar para Orientações"><i data-icon="arrow-left"></i></a>
      <span class="topbar__title">Orientações</span>
      <span></span>
    </header>
    <main class="screen" id="conteudo"></main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const { api, esc, icon, qs, toast } = Violet;
      const alvo = document.getElementById("conteudo");
      let itens = [];
      try { itens = await api.listarOrientacoes(); } catch { /* sem conexão */ }
      const o = itens.find((x) => String(x.id) === qs("id")) || itens[0];
      if (!o) { alvo.innerHTML = `<div class="empty"><p>Não foi possível carregar esta orientação.</p><a class="link" href="orientacoes.html">Voltar</a></div>`; return; }
      document.title = `${o.titulo} · Violet`;
      let corpo = "";

      if (o.passos) {
        corpo = `<ol class="orient-list">${o.passos.map((p, i) => `
          <li class="orient-card orient-card--passo">
            <span class="orient-card__ico orient-card__num">${p.i ? icon(p.i) : i + 1}</span>
            <div class="grow"><b>${p.i ? `${i + 1}. ` : ""}${esc(p.t)}</b><span>${esc(p.d)}</span></div>
          </li>`).join("")}</ol>`;
      }
      if (o.canais) {
        corpo = `<div class="orient-list">${o.canais.map((c) => `
          <div class="orient-card">
            <span class="orient-card__ico">${icon(c.icon || "phone")}</span>
            <div class="grow"><b>${esc(c.nome)}${c.numero ? ` (${esc(c.numero)})` : ""}</b><span>${esc(c.desc)}</span></div>
            ${c.numero
              ? `<a class="orient-btn" href="tel:${esc(c.numero)}">${icon("phone", "sm")} Ligar</a>`
              : `<button type="button" class="orient-btn" data-contato="${esc(c.nome)}">Contato</button>`}
          </div>`).join("")}</div>`;
      }
      if (o.faq) {
        corpo = `
          <div class="orient-sos"><a href="emergencia.html" aria-label="Abrir o botão de emergência">${icon("bell", "xl")}</a></div>
          <div class="orient-list">${o.faq.map((f) => `
            <div class="orient-card orient-card--faq"><div class="grow"><b>${esc(f.q)}</b><span>${esc(f.a)}</span></div></div>`).join("")}</div>`;
      }

      alvo.innerHTML = `
        <h2 class="orient-titulo">${esc(o.titulo)}</h2>
        ${corpo}
        ${o.aviso ? `<div class="orient-aviso">${icon("alert-circle")}<span>${esc(o.aviso)}</span></div>` : ""}`;
      alvo.querySelectorAll("[data-contato]").forEach((b) => b.addEventListener("click", () => toast(`${b.dataset.contato}: procure presencialmente. O contato direto chega na fase de integrações.`)));
      Violet.renderIcons(alvo);
    });
  </script>
</body>
</html>
