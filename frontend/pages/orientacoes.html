<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7fc">
  <title>Orientações · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app has-nav" data-nav="inicio">
    <header class="topbar">
      <a class="icon-btn" href="home.html" aria-label="Voltar para o início"><i data-icon="arrow-left"></i></a>
      <span class="topbar__title">Orientações</span>
      <span></span>
    </header>
    <main class="screen">
      <p class="lead">Informações sobre seus direitos, como agir e onde encontrar apoio. Você não está sozinha.</p>
      <div class="orient-list" id="lista"></div>

      <a href="tel:180" class="orient-card orient-card--sos">
        <span class="orient-card__ico"><i data-icon="phone"></i></span>
        <div class="grow"><b>Ligue 180</b><span>Central de Atendimento à Mulher · 24h, gratuito</span></div>
        <i data-icon="chevron-right" class="list-item__chev"></i>
      </a>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const { api, esc, icon } = Violet;
      let itens = [];
      try { itens = await api.listarOrientacoes(); } catch { /* sem conexão */ }
      document.getElementById("lista").innerHTML = itens.length ? itens.map((o) => `
        <a href="orientacao.html?id=${encodeURIComponent(o.id)}" class="orient-card">
          <span class="orient-card__ico">${icon(o.icon || "help-circle")}</span>
          <div class="grow"><b>${esc(o.titulo)}</b><span>${esc(o.resumo)}</span></div>
          ${icon("chevron-right", "sm")}
        </a>`).join("") : `<div class="empty"><p>Não foi possível carregar as orientações agora.</p></div>`;
    });
  </script>
</body>
</html>
