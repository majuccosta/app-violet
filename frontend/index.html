<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7d6f7">
  <meta name="description" content="Violet — segurança feminina no ambiente acadêmico.">
  <title>Violet · Segurança feminina no ambiente acadêmico</title>
  <link rel="icon" href="assets/img/logo.svg">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="assets/js/i18n.js"></script>
</head>
<body>
  <div class="app">
    <main class="welcome">
      <!-- Fundo: onda no topo, bolha à direita e pontinhos -->
      <span class="welcome__wave" aria-hidden="true"></span>
      <span class="welcome__blob" aria-hidden="true"></span>
      <span class="welcome__dots" aria-hidden="true"></span>

      <header class="welcome__brand">
        <img src="assets/img/logo-flores.png" alt="" class="welcome__flores">
        <h1 class="welcome__nome">VIOLET</h1>
        <p class="welcome__tag">Segurança feminina<br>no ambiente acadêmico</p>
      </header>

      <!-- Ilustração (SVG desenhado à mão: dá para editar cores direto aqui) -->
      <svg class="welcome__art" viewBox="0 50 400 470" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <defs>
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" style="stop-color:var(--art-fade)" stop-opacity="0"/>
            <stop offset="1" style="stop-color:var(--art-fade)" stop-opacity=".95"/>
          </linearGradient>
          <radialGradient id="halo" cx=".5" cy=".55" r=".5">
            <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
            <stop offset="1" stop-color="#fff" stop-opacity="0"/>
          </radialGradient>
        </defs>

        <!-- Círculos de proteção atrás das mulheres -->
        <circle cx="200" cy="300" r="190" fill="url(#halo)"/>
        <circle cx="200" cy="300" r="150" fill="#fff" opacity=".14"/>
        <circle cx="200" cy="300" r="110" fill="#fff" opacity=".12"/>
        <path d="M18 300a182 182 0 0 1 364 0" fill="none" stroke="#fff" stroke-opacity=".7" stroke-width="2" stroke-dasharray="1 9" stroke-linecap="round"/>

        <!-- Prédios do campus -->
        <g class="a-pred" opacity=".75">
          <path d="M-10 250 L55 205 L120 250 V520 H-10Z"/>
          <path d="M280 245 L345 200 L410 245 V520 H280Z"/>
        </g>
        <g class="a-janela" opacity=".9">
          <rect x="10" y="268" width="14" height="18" rx="3"/><rect x="38" y="268" width="14" height="18" rx="3"/>
          <rect x="10" y="300" width="14" height="18" rx="3"/><rect x="38" y="300" width="14" height="18" rx="3"/>
          <rect x="342" y="262" width="14" height="18" rx="3"/><rect x="370" y="262" width="14" height="18" rx="3"/>
          <rect x="342" y="294" width="14" height="18" rx="3"/><rect x="370" y="294" width="14" height="18" rx="3"/>
        </g>

        <!-- Mulher do centro: cabelo longo e liso -->
        <g class="mulher mulher--c">
          <rect x="146" y="176" width="108" height="190" rx="54" class="a-cabelo"/>
          <path d="M100 520 C100 360 140 330 200 330 C260 330 300 360 300 520Z" class="a-roupa-c"/>
          <path d="M150 520 C150 380 165 350 200 350 C235 350 250 380 250 520Z" class="a-roupa-c2" opacity=".55"/>
          <rect x="186" y="262" width="28" height="74" rx="12" fill="#e6b0ac"/>
          <ellipse cx="200" cy="226" rx="38" ry="46" fill="#efc1bc"/>
          <path d="M160 222 C158 182 182 168 200 168 C222 168 244 182 240 222 C232 200 214 190 200 190 C186 190 168 200 160 222Z" class="a-cabelo"/>
          <path d="M186 224 q5 5 10 0 M206 224 q5 5 10 0" stroke="#3b1a40" stroke-width="2.6" fill="none" stroke-linecap="round"/>
          <circle cx="180" cy="240" r="6" fill="#f39fae" opacity=".55"/><circle cx="222" cy="240" r="6" fill="#f39fae" opacity=".55"/>
          <path d="M193 247 q8 7 16 0" stroke="#a04a5c" stroke-width="2.6" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Mulher da esquerda: cabelo crespo, brincos de argola -->
        <g class="mulher mulher--e">
          <g class="a-cabelo">
            <circle cx="95" cy="238" r="44"/><circle cx="62" cy="226" r="22"/><circle cx="128" cy="226" r="22"/>
            <circle cx="72" cy="200" r="22"/><circle cx="118" cy="200" r="22"/><circle cx="95" cy="190" r="24"/>
            <circle cx="58" cy="252" r="18"/><circle cx="132" cy="252" r="18"/>
          </g>
          <path d="M0 520 C2 372 40 350 95 350 C150 350 190 372 192 520Z" class="a-roupa-e"/>
          <path d="M70 352 L95 400 L120 352Z" fill="#8e4c5a"/>
          <rect x="83" y="282" width="24" height="76" rx="11" fill="#8e4c5a"/>
          <ellipse cx="95" cy="258" rx="32" ry="39" fill="#9a5862"/>
          <path d="M66 236 C70 214 120 214 124 236 C112 226 78 226 66 236Z" class="a-cabelo"/>
          <path d="M82 256 q4 4 8 0 M101 256 q4 4 8 0" stroke="#2b0f3d" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="78" cy="270" r="5" fill="#d9707f" opacity=".5"/><circle cx="112" cy="270" r="5" fill="#d9707f" opacity=".5"/>
          <path d="M88 277 q7 6 14 0" stroke="#5b2430" stroke-width="2.4" fill="none" stroke-linecap="round"/>
          <circle cx="62" cy="280" r="8" fill="none" stroke="#fff" stroke-width="2.4"/>
          <circle cx="128" cy="280" r="8" fill="none" stroke="#fff" stroke-width="2.4"/>
        </g>

        <!-- Mulher da direita: coque e óculos -->
        <g class="mulher mulher--d">
          <circle cx="305" cy="200" r="16" class="a-cabelo"/>
          <rect x="268" y="218" width="74" height="70" rx="30" class="a-cabelo"/>
          <path d="M208 520 C210 376 250 354 305 354 C360 354 398 376 400 520Z" class="a-roupa-d"/>
          <rect x="293" y="286" width="24" height="74" rx="11" fill="#f0bf9c"/>
          <ellipse cx="305" cy="264" rx="32" ry="38" fill="#f6cdae"/>
          <path d="M272 254 C270 226 290 216 305 216 C322 216 342 226 338 254 C330 238 316 232 305 232 C292 232 280 238 272 254Z" class="a-cabelo"/>
          <g fill="none" stroke="#2b0f3d" stroke-width="2.6">
            <circle cx="291" cy="262" r="10"/><circle cx="319" cy="262" r="10"/><path d="M301 262h8"/>
          </g>
          <circle cx="291" cy="262" r="2.6" class="a-cabelo"/><circle cx="319" cy="262" r="2.6" class="a-cabelo"/>
          <circle cx="285" cy="280" r="5" fill="#f39fae" opacity=".5"/><circle cx="325" cy="280" r="5" fill="#f39fae" opacity=".5"/>
          <path d="M298 284 q7 6 14 0" stroke="#a04a5c" stroke-width="2.4" fill="none" stroke-linecap="round"/>
        </g>

        <!-- Ícones flutuando: localização, proteção, apoio -->
        <g transform="translate(58 150)"><g class="bolha bolha--1">
          <circle r="22" fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".8"/>
          <path d="M0 9s-8-6.5-8-12a8 8 0 0 1 16 0c0 5.5-8 12-8 12Z M0 -3m-2.6 0a2.6 2.6 0 1 0 5.2 0a2.6 2.6 0 1 0-5.2 0" fill="none" stroke="#5b2388" stroke-width="2" stroke-linejoin="round"/>
        </g></g>
        <g transform="translate(200 96)"><g class="bolha bolha--2">
          <circle r="27" fill="#fff" fill-opacity=".45" stroke="#fff" stroke-opacity=".85"/>
          <path d="M0 13s10-5 10-12.5V-7L0-11l-10 4v7.5C-10 8 0 13 0 13Z" fill="none" stroke="#5b2388" stroke-width="2.2" stroke-linejoin="round"/>
          <path d="m-4 0 3 3 5-5.5" fill="none" stroke="#5b2388" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </g></g>
        <g transform="translate(342 152)"><g class="bolha bolha--3">
          <circle r="22" fill="#fff" fill-opacity=".4" stroke="#fff" stroke-opacity=".8"/>
          <path d="M8.5 1.5 0 9.5-8.5 1.5A5.2 5.2 0 0 1 0-5.2a5.2 5.2 0 0 1 8.5 6.7Z" fill="none" stroke="#5b2388" stroke-width="2" stroke-linejoin="round"/>
        </g></g>

        <!-- Brilhos -->
        <g fill="#fff">
          <path class="brilho" d="M120 90 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3Z"/>
          <path class="brilho brilho--2" d="M296 68 l3.5 10 10 3.5 -10 3.5 -3.5 10 -3.5 -10 -10 -3.5 10 -3.5Z"/>
          <path class="brilho brilho--3" d="M262 138 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/>
          <path class="brilho brilho--2" d="M34 200 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/>
          <path class="brilho" d="M372 206 l2 6 6 2 -6 2 -2 6 -2 -6 -6 -2 6 -2Z"/>
        </g>

        <!-- Escurece a base para o botão ficar legível -->
        <rect x="0" y="390" width="400" height="130" fill="url(#fade)"/>
      </svg>

      <div class="welcome__actions">
        <a href="pages/cadastro.html" class="btn welcome__cta">Começar <i data-icon="arrow-right" data-size="sm"></i></a>
        <p class="welcome__login">Já tem conta? <a href="pages/login.html">Entrar</a></p>
      </div>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
