<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e7d6f7">
  <meta name="description" content="Violet — segurança feminina no ambiente acadêmico.">
  <title>Violet · Segurança feminina no ambiente acadêmico</title>
  <link rel="icon" href="assets/img/logo.svg">
  <script src="assets/js/theme.js"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&display=swap">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/pages.css">
  <script src="assets/js/i18n.js"></script>
</head>
<body>
  <div class="app">
    <main class="welcome">
      <!-- Fundo: ilustração animada. As mulheres balançam e respiram (assets/js/fundo-animado.js);
           a imagem abaixo é o plano B quando o navegador não tem WebGL ou pede menos movimento. -->
      <div class="welcome__bg" aria-hidden="true">
        <img src="assets/img/fundo-violet.jpg" alt="" class="welcome__foto" fetchpriority="high" decoding="async">
        <span class="welcome__fade"></span>
        <i class="spark spark--1"></i><i class="spark spark--2"></i><i class="spark spark--3"></i>
        <i class="spark spark--4"></i><i class="spark spark--5"></i><i class="spark spark--6"></i>
      </div>

      <!-- Ícones flutuando: localização, proteção e apoio -->
      <div class="welcome__icones" aria-hidden="true">
        <span class="bolha bolha--1"><svg viewBox="-12 -14 24 28"><path d="M0 9s-8-6.5-8-12a8 8 0 0 1 16 0c0 5.500-8 12-8 12Z M0 -3m-2.600 0a2.600 2.600 0 1 0 5.200 0a2.600 2.600 0 1 0-5.200 0"/></svg></span>
        <span class="bolha bolha--2"><svg viewBox="-12 -14 24 28"><path d="M0 13s10-5 10-12.500V-7L0-11l-10 4v7.500C-10 8 0 13 0 13Z"/><path d="m-4 0 3 3 5-5.500"/></svg></span>
        <span class="bolha bolha--3"><svg viewBox="-12 -14 24 28"><path d="M8.500 1.500 0 9.500-8.500 1.500A5.200 5.200 0 0 1 0-5.200a5.200 5.200 0 0 1 8.500 6.700Z"/></svg></span>
        <svg class="brilho brilho--a" viewBox="-12 -12 24 24"><path d="M0-11 3 -3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></svg>
        <svg class="brilho brilho--b" viewBox="-12 -12 24 24"><path d="M0-11 3 -3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></svg>
        <svg class="brilho brilho--c" viewBox="-12 -12 24 24"><path d="M0-11 3 -3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></svg>
        <svg class="brilho brilho--d" viewBox="-12 -12 24 24"><path d="M0-11 3 -3 11 0 3 3 0 11-3 3-11 0-3-3Z"/></svg>
      </div>

      <header class="welcome__brand">
        <img src="assets/img/logo-flores.png" alt="" class="welcome__flores">
        <h1 class="welcome__nome">VIOLET</h1>
        <p class="welcome__tag">Segurança feminina<br>no ambiente acadêmico</p>
      </header>

      <div class="welcome__actions">
        <a href="pages/cadastro.html" class="btn welcome__cta">Começar <i data-icon="arrow-right" data-size="sm"></i></a>
        <p class="welcome__login">Já tem conta? <a href="pages/login.html">Entrar</a></p>
      </div>
    </main>
  </div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/mock-data.js"></script>
  <script src="assets/js/api.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="assets/js/fundo-animado.js"></script>
</body>
</html>
