<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7fc">
  <title>Perfil · Violet</title>
  <link rel="icon" href="../assets/img/logo.svg">
  <script src="../assets/js/theme.js"></script>
  <link rel="stylesheet" href="../assets/css/tokens.css">
  <link rel="stylesheet" href="../assets/css/base.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <link rel="stylesheet" href="../assets/css/pages.css">
  <script src="../assets/js/i18n.js"></script>
</head>
<body>
  <div class="app has-nav" data-nav="perfil">
    <header class="topbar"><span></span><span class="topbar__title">Perfil</span><span></span></header>
    <main class="screen" style="padding-top:0">
      <section class="profile-card">
        <span class="avatar avatar--lg" id="p-iniciais">MJ</span>
        <h2 id="p-nome">Maria Júlia Costa</h2>
        <p class="text-sm text-muted" id="p-email">mariajulia@ceub.edu.br</p>
        <span class="badge badge--success"><i data-icon="shield-check" data-size="sm"></i> Identidade verificada</span>
      </section>


      <nav class="divided-list" aria-label="Opções do perfil">
        <a href="conta.html" class="list-item"><span class="icon-badge"><i data-icon="id-card"></i></span><span class="grow list-item__title">Minha conta</span><i data-icon="chevron-right" class="list-item__chev"></i></a>
        <a href="historico.html" class="list-item"><span class="icon-badge"><i data-icon="file-text"></i></span><span class="grow list-item__title">Histórico de denúncias</span><i data-icon="chevron-right" class="list-item__chev"></i></a>
        <a href="configuracoes.html" class="list-item"><span class="icon-badge"><i data-icon="settings"></i></span><span class="grow list-item__title">Configurações</span><i data-icon="chevron-right" class="list-item__chev"></i></a>
        <a href="sobre.html" class="list-item"><span class="icon-badge"><i data-icon="info"></i></span><span class="grow list-item__title">Sobre o Violet</span><i data-icon="chevron-right" class="list-item__chev"></i></a>
      </nav>

      <a href="../index.html" class="btn btn--ghost" id="btn-sair" style="color:var(--danger-600)"><i data-icon="log-out" data-size="sm"></i> Sair da conta</a>
    </main>
  </div>

  <script src="../assets/js/icons.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const { api, initials, toast, store } = Violet;
      const eu = await api.me();
      document.getElementById("p-nome").textContent = eu.nome;
      document.getElementById("p-email").textContent = eu.email;
      document.getElementById("p-iniciais").textContent = initials(eu.nome);
      document.getElementById("btn-sair").addEventListener("click", () => store.set("token", null));
    });
  </script>
</body>
</html>
